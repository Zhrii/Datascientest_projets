# =============================================================================
# Stack MLOps Rakuten — calquée sur le schéma "Architecture Overview"
#
#   Inference Layer
#     api-gateway : nginx, répartit la charge sur les répliques -> http://localhost:8000/docs
#     api         : FastAPI texte / image / fusion, API_REPLICAS répliques (défaut 2)
#     redis       : état partagé des répliques (limites, verrou /retrain, journal des prédictions)
#     streamlit   : interface de démo (appelle l'API)          -> http://localhost:8501
#   Pipeline Execution
#     train       : Pipeline Runner ZenML (profil "jobs")
#                   collect -> validate -> preprocess -> train -> promote
#   ZenML Platform
#     zenml       : suivi des pipelines                        -> http://localhost:8888
#   Storage Layer
#     mysql       : métadonnées ZenML
#     minio       : S3 — artefacts ZenML, MLflow, données DVC  -> http://localhost:9001
#     mlflow      : expériences + Model Registry               -> http://localhost:5000
#   Automatisation
#     scheduler   : déclenche /retrain tout seul (modèle trop vieux, +10 % de données)
#   Monitoring
#     drift-monitor : dérive des données (Evidently)           -> reports/drift_report.html
#     prometheus  : métriques + règles d'alerte                -> http://localhost:9092
#     grafana     : tableaux de bord + alertes actives         -> http://localhost:3002
#
#   docker compose up -d --build
#   docker compose run --rm train          (= make train)
#
# Comptes de l'API (HTTP Basic) — à changer via un fichier .env :
#   admin / ${ADMIN_PASSWORD:-rakuten}  rôle admin : /predict, /model/info, /retrain
#   demo  / ${DEMO_PASSWORD:-demo}      rôle user  : /predict
# =============================================================================

x-s3: &s3-env
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000

# compte "user" (prédictions) et compte "admin" (réentraînement) des clients de l'API
x-api-user: &api-user
  API_USERNAME: demo
  API_PASSWORD: ${DEMO_PASSWORD:-demo}

x-api-admin: &api-admin
  API_ADMIN_USERNAME: admin
  API_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-rakuten}

x-zenml-client: &zenml-client-env
  ZENML_STORE_URL: http://zenml:8080
  ZENML_STORE_USERNAME: default
  ZENML_STORE_PASSWORD: zenml
  ZENML_ANALYTICS_OPT_IN: "false"
  ZENML_CONFIG_PATH: /app/.zenml
  GIT_PYTHON_REFRESH: quiet         # pas de git dans les images : MLflow n'insiste pas

services:
  # ---- Inference Layer ----
  api-gateway:
    image: nginx:1.28.0-alpine
    container_name: rakuten-api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 et non localhost : dans le container, localhost = ::1 (IPv6), où nginx n'écoute pas
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: rakuten-api:latest
    deploy:
      replicas: ${API_REPLICAS:-2}    # scalabilité : plusieurs répliques derrière nginx
    environment:
      <<: [*s3-env, *zenml-client-env]
      API_USERS: admin:${ADMIN_PASSWORD:-rakuten}:admin,demo:${DEMO_PASSWORD:-demo}:user
      REDIS_URL: redis://redis:6379/0
      MODELS_DIR: /app/models
      DATA_BRUT_DIR: /app/data_brut
      MLFLOW_TRACKING_URI: http://mlflow:5000
      HF_HOME: /app/.cache/huggingface
      PREDICT_RATE_LIMIT: ${PREDICT_RATE_LIMIT:-30/minute}
      PREDICT_RATE_LIMIT_ADMIN: ${PREDICT_RATE_LIMIT_ADMIN:-600/minute}
      RETRAIN_RATE_LIMIT: ${RETRAIN_RATE_LIMIT:-2/hour}
      MODEL_REFRESH_SECONDS: ${MODEL_REFRESH_SECONDS:-60}
    volumes:
      # écriture nécessaire pour POST /retrain (candidat + promotion)
      - ./models:/app/models
      - ./artifacts:/app/artifacts:ro
      - "./data brut:/app/data_brut:ro"
      - ./data:/app/data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  redis:
    image: redis:7.4.2-alpine
    container_name: rakuten-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  streamlit:
    image: rakuten-api:latest
    container_name: rakuten-streamlit
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      <<: [*api-user, *api-admin]
      API_URL: http://api-gateway:8000
      MODELS_DIR: /app/models
      REPORTS_DIR: /app/reports
    volumes:
      - ./models:/app/models:ro
      - ./images:/app/images:ro
      - ./reports:/app/reports:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ---- Pipeline Execution (make train) ----
  train:
    build:
      context: .
      dockerfile: Dockerfile.training
    image: rakuten-training:latest
    profiles: ["jobs"]                # pas lancé par "docker compose up"
    environment:
      <<: [*s3-env, *zenml-client-env]
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - "./data brut:/app/data_brut:ro"   # données de départ (lecture seule, versionnées par DVC)
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mlflow:
        condition: service_healthy
      zenml:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ---- Automatisation des entraînements ----
  scheduler:
    image: rakuten-training:latest
    container_name: rakuten-scheduler
    command: ["python", "pipelines/scheduler.py"]
    environment:
      API_URL: http://api-gateway:8000
      API_USERNAME: admin                       # /retrain demande le rôle admin
      API_PASSWORD: ${ADMIN_PASSWORD:-rakuten}
      DATA_BRUT_DIR: /app/data_brut
      MODELS_DIR: /app/models
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3600}
      RETRAIN_MAX_AGE_DAYS: ${RETRAIN_MAX_AGE_DAYS:-30}
      NEW_DATA_THRESHOLD: ${NEW_DATA_THRESHOLD:-0.10}
    volumes:
      - "./data brut:/app/data_brut:ro"
      - ./models:/app/models:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ---- Surveillance de la dérive des données ----
  drift-monitor:
    image: rakuten-training:latest
    container_name: rakuten-drift-monitor
    command: ["python", "pipelines/drift_monitor.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DRIFT_REFERENCE_CSV: /app/data/processed/processed_data.csv
      REPORTS_DIR: /app/reports
      DRIFT_CHECK_SECONDS: ${DRIFT_CHECK_SECONDS:-120}
      DRIFT_WINDOW: ${DRIFT_WINDOW:-300}
      DRIFT_MIN_SAMPLES: ${DRIFT_MIN_SAMPLES:-200}
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- ZenML Platform ----
  zenml:
    image: zenmldocker/zenml-server:0.98.0
    container_name: rakuten-zenml
    ports:
      - "8888:8080"
    environment:
      ZENML_STORE_URL: mysql://zenml:zenml@mysql:3306/zenml
      ZENML_SERVER_AUTO_ACTIVATE: "1"
      ZENML_DEFAULT_USER_NAME: default
      ZENML_DEFAULT_USER_PASSWORD: zenml
      ZENML_ANALYTICS_OPT_IN: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  # ---- Storage Layer ----
  mysql:
    image: mysql:8.0
    container_name: rakuten-mysql
    environment:
      MYSQL_ROOT_PASSWORD: zenml
      MYSQL_DATABASE: zenml
      MYSQL_USER: zenml
      MYSQL_PASSWORD: zenml
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzenml", "-pzenml"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: rakuten-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # aussi utilisé par DVC depuis le poste (dvc push / pull)
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # crée les buckets "mlflow", "zenml" et "dvc" au démarrage
  minio-init:
    image: minio/mc:RELEASE.2024-07-31T15-58-33Z
    container_name: rakuten-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mlflow &&
      mc mb -p local/zenml &&
      mc mb -p local/dvc
      "

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: rakuten-mlflow
    ports:
      - "5000:5000"
    environment:
      <<: *s3-env
    volumes:
      - mlflow_data:/mlflow/data      # runs, métriques, Model Registry
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:                      # sert à savoir quand MLflow est prêt
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---- Monitoring ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rakuten-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9092:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - drift-monitor
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rakuten-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: rakuten
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3002
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mlflow_data:
  minio_data:
  mysql_data:
  prometheus_data:
  grafana_data:
  hf_cache:
