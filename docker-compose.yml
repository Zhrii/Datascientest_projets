# =============================================================================
# Stack MLOps — alignée sur le schéma Architecture Overview
#
# Ports (hôte) :
#   FastAPI        :8000
#   Streamlit      :8501
#   ZenML Server   :8888
#   Prometheus     :9092
#   Grafana        :3002
#   MLflow         :5000
#   MinIO API      :9000  / console :9001
#   MySQL          :3306
#
# Démarrage :
#   docker compose up -d --build
#   docker compose run --rm train    # make train
# =============================================================================

services:
  # ---- Inference Layer (FastAPI) ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rakuten-app:latest
    container_name: rakuten-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MODELS_DIR: /app/models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRAIN_MAX_ROWS: ${TRAIN_MAX_ROWS:-15000}
      HF_HOME: /app/.cache/huggingface
    volumes:
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - "./data brut:/app/data brut"
      - ./data:/app/data
      - hf_cache:/app/.cache/huggingface
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - rakuten
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ---- UI (client API) ----
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    image: rakuten-app:latest
    container_name: rakuten-streamlit
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      MODELS_DIR: /app/models
    volumes:
      - ./models:/app/models
      - ./images:/app/images
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rakuten
    restart: unless-stopped

  # ---- Pipeline Execution (make train) ----
  train:
    build:
      context: .
      dockerfile: Dockerfile
    image: rakuten-app:latest
    container_name: rakuten-train
    profiles: ["train"]
    command: python pipelines/train_pipeline.py
    environment:
      MODELS_DIR: /app/models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      TRAIN_MAX_ROWS: ${TRAIN_MAX_ROWS:-15000}
    volumes:
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - "./data brut:/app/data brut"
      - ./data:/app/data
    depends_on:
      - mlflow
      - minio
    networks:
      - rakuten

  # ---- Storage : MLflow Experiments ----
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: rakuten-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - rakuten
    restart: unless-stopped

  # ---- Storage : MinIO S3 Artifact Store ----
  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: rakuten-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - rakuten
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Crée le bucket artefacts au démarrage
  minio-init:
    image: minio/mc:RELEASE.2024-07-31T15-58-33Z
    container_name: rakuten-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/mlflow || true;
      mc mb -p local/zenml || true;
      mc mb -p local/artifacts || true;
      exit 0;
      "
    networks:
      - rakuten

  # ---- Storage : MySQL (ZenML Metadata) ----
  mysql:
    image: mysql:8.0
    container_name: rakuten-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: zenml
      MYSQL_DATABASE: zenml
      MYSQL_USER: zenml
      MYSQL_PASSWORD: zenml
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rakuten
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzenml", "-pzenml"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---- ZenML Platform ----
  zenml:
    image: zenmldocker/zenml-server:0.67.0
    container_name: rakuten-zenml
    ports:
      - "8888:8080"
    environment:
      ZENML_STORE_URL: mysql://zenml:zenml@mysql:3306/zenml
      ZENML_DEFAULT_USER_NAME: default
      ZENML_DEFAULT_USER_PASSWORD: zenml
      ZENML_SERVER_DEPLOYMENT_TYPE: docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rakuten
    restart: unless-stopped

  # ---- Monitoring : Prometheus (schéma :9092) ----
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rakuten-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "9092:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    networks:
      - rakuten
    restart: unless-stopped

  # ---- Monitoring : Grafana (schéma :3002) ----
  grafana:
    image: grafana/grafana:11.1.0
    container_name: rakuten-grafana
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: rakuten
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3002
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - rakuten
    restart: unless-stopped

networks:
  rakuten:
    driver: bridge

volumes:
  mlflow_data:
  minio_data:
  mysql_data:
  grafana_data:
  prometheus_data:
  hf_cache:
