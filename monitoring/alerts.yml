# Règles d'alerte Prometheus — visibles sur http://localhost:9092/alerts
# et dans le dashboard Grafana "Rakuten Inference API" (panneau "Alertes actives").
groups:
  - name: rakuten-api
    rules:
      - alert: ApiDown
        expr: sum(up{job="rakuten-api"}) == 0 or absent(up{job="rakuten-api"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Plus aucune réplique de l'API ne répond"
          description: "Prometheus n'arrive plus à lire /metrics sur aucune réplique depuis 1 minute."

      # une réplique arrêtée disparaît du DNS de Docker (et donc des cibles) :
      # on compte les répliques présentes au lieu de chercher up == 0
      # (2 = API_REPLICAS de docker-compose.yml)
      - alert: ApiReplicaDown
        expr: count(up{job="rakuten-api"} == 1) < 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Une réplique de l'API manque ({{ $value }} en service sur 2)"
          description: "nginx envoie le trafic sur les répliques restantes ; capacité réduite."

      - alert: ModelNotLoaded
        expr: model_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Modèle {{ $labels.pipeline }} non chargé"
          description: "Le pipeline {{ $labels.pipeline }} est indisponible depuis 2 minutes (voir GET /health)."

      - alert: HighErrorRate
        expr: |
          sum(rate(predict_requests_total{status!="ok"}[5m]))
            / sum(rate(predict_requests_total[5m])) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 10 % de prédictions en erreur"
          description: "Taux d'erreur /predict : {{ $value | humanizePercentage }} sur 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(predict_latency_seconds_bucket[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prédictions lentes (p95 > 2 s)"
          description: "Latence p95 de /predict : {{ $value | humanizeDuration }}."

      - alert: RateLimitHit
        expr: sum(increase(rate_limited_total[5m])) > 10
        labels:
          severity: warning
        annotations:
          summary: "Beaucoup de requêtes bloquées par la limite"
          description: "{{ $value | printf \"%.0f\" }} requêtes refusées (429) en 5 minutes : usage anormal ou client mal configuré."

      - alert: ForbiddenAccess
        expr: sum(increase(forbidden_total[5m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "Accès refusés faute de droits (403)"
          description: "{{ $value | printf \"%.0f\" }} appels à une route admin par un compte user en 5 minutes."

      - alert: AuthFailures
        expr: sum(increase(auth_failures_total[5m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "Tentatives de connexion refusées"
          description: "{{ $value | printf \"%.0f\" }} échecs d'authentification en 5 minutes (mot de passe deviné ?)."

  - name: rakuten-model
    rules:
      - alert: ModelF1Low
        expr: model_f1_macro{pipeline="text"} < 0.75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "F1-macro du modèle texte sous 0,75"
          description: "F1-macro du modèle en production : {{ $value }} (seuil de docs/STRATEGIE_REENTRAINEMENT.md)."

      - alert: ModelTooOld
        expr: (time() - model_trained_timestamp_seconds) / 86400 > 30
        labels:
          severity: info
        annotations:
          summary: "Modèle texte entraîné il y a plus de 30 jours"
          description: "Âge du modèle : {{ $value | printf \"%.0f\" }} jours. Le scheduler devrait relancer un entraînement."

  - name: rakuten-data
    rules:
      - alert: DataDrift
        expr: data_drift_detected == 1
        labels:
          severity: warning
        annotations:
          summary: "Dérive des données en production"
          description: "{{ with query \"data_drift_share\" }}{{ . | first | value | humanizePercentage }}{{ end }} des variables surveillées ont dérivé (rapport Evidently : reports/drift_report.html)."

      - alert: DriftMonitorDown
        expr: up{job="rakuten-drift"} == 0 or (time() - data_drift_last_check_timestamp_seconds) > 900
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "La détection de dérive ne tourne plus"
          description: "Aucune analyse de dérive depuis plus de 15 minutes."
