# Répartiteur de charge devant les répliques de l'API (service "api-gateway").
#
# "api" est le nom du service Docker : le DNS de Docker renvoie l'adresse de
# chaque réplique (docker-compose.yml : deploy.replicas). Avec "resolve", nginx
# refait la résolution toutes les 10 s : une réplique redémarrée (nouvelle IP)
# est retrouvée sans relancer nginx.

upstream rakuten_api {
    zone rakuten_api 64k;
    server api:8000 resolve max_fails=1 fail_timeout=10s;  # écartée 10 s dès le premier échec
}

resolver 127.0.0.11 valid=10s ipv6=off;  # DNS interne de Docker

server {
    listen 8000;

    client_max_body_size 20m;  # upload d'images produit
    proxy_connect_timeout 2s;  # réplique tombée : on passe vite à la suivante

    location / {
        proxy_pass http://rakuten_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;  # première prédiction fusion (CLIP) un peu lente

        # une réplique en panne : nginx rejoue la requête sur l'autre. Par défaut
        # seulement pour les GET : un POST n'est jamais rejoué (/retrain ne doit pas
        # lancer deux entraînements).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
    }

    location = /predict {
        proxy_pass http://rakuten_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        # une prédiction peut être rejouée sans risque (elle ne modifie rien) :
        # si une réplique vient de tomber, le client ne voit pas d'erreur
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 3;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
