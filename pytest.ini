[pytest]
# ne chercher les tests que dans tests/ (sinon pytest parcourt data/ et ses 85 000 images)
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`
    # chi² d'Evidently sur une catégorie absente d'un des deux jeux : attendu dans test_drift
    ignore:divide by zero encountered in divide:RuntimeWarning
